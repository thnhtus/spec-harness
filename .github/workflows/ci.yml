name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node install.mjs --self-test
      - run: node install.mjs --eval-check
