# spec-harness gate ở CI — chỗ `git commit --no-verify` không với tới được.
# Bản của chính repo spec-harness (validator ở kernel/scripts/).
name: spec-harness

on: [push, pull_request]

jobs:
  validate-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # --preflight trước: config tự mâu thuẫn (hoặc repos[].path sai) thì mọi
      # check sau im lặng no-op. Bao gồm --self-check.
      - run: node kernel/scripts/validate-tasks.mjs --preflight
      - run: node kernel/scripts/validate-tasks.mjs
      - run: node install.mjs --self-test

      # Self-test ở trên chạy từ CÂY REPO — nó thấy mọi file, kể cả file mà
      # installer quên copy hoặc package.json quên khai trong `files:`. Nên chạy
      # lại đúng self-test đó trên tarball đã pack: đó mới là thứ người dùng nhận.
      # Thiếu bước này thì "thêm folder mới, quên khai" là lỗi CI không bao giờ thấy.
      - name: self-test trên tarball đã pack (không phải trên cây repo)
        run: |
          npm pack --silent | tail -1 | xargs -I{} tar xzf {} -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/package"
          node install.mjs --self-test
