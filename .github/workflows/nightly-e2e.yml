# spec-harness nightly e2e (#117) — chạy agent THẬT, không chỉ self-test.
# Self-test chứng minh script không hỏng; cái này chứng minh gate vẫn bắt được lỗi.
# Chỉ cho repo nguồn: --eval cần install.mjs + kernel/eval. Không cài vào project người dùng.
#
# Secret cần có (thiếu thì job skip sạch, KHÔNG đỏ — một job đỏ vì thiếu key
# dạy người ta bỏ qua CI đỏ):
#   ANTHROPIC_API_KEY  → claude
#   OPENAI_API_KEY     → codex
name: nightly-e2e

on:
  schedule: [{ cron: "0 18 * * *" }]
  workflow_dispatch:
    inputs:
      cli:
        description: "claude | codex | both"
        default: both

jobs:
  eval:
    # Mỗi job tốn tiền thật. Đo local: ~5-9 phút/case x 7 case = 35-65 phút, nên 90. Trần cứng: một agent treo không
    # được phép đốt hết quota runner.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cli: [claude, codex]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24' }

      # Một bước quyết định có chạy hay không: không key = skip, không phải fail.
      - id: gate
        env:
          KEY: ${{ matrix.cli == 'claude' && secrets.ANTHROPIC_API_KEY || secrets.OPENAI_API_KEY }}
          WANT: ${{ github.event.inputs.cli || 'both' }}
        run: |
          if [ -z "$KEY" ]; then echo "run=no" >> $GITHUB_OUTPUT; echo "::notice::no API key for ${{ matrix.cli }} — skipped"; exit 0; fi
          if [ "$WANT" != "both" ] && [ "$WANT" != "${{ matrix.cli }}" ]; then echo "run=no" >> $GITHUB_OUTPUT; exit 0; fi
          echo "run=yes" >> $GITHUB_OUTPUT

      - if: steps.gate.outputs.run == 'yes' && matrix.cli == 'claude'
        run: npm i -g @anthropic-ai/claude-code
      - if: steps.gate.outputs.run == 'yes' && matrix.cli == 'codex'
        run: npm i -g @openai/codex

      # Gate 5 thật: fixture có lỗi phải FAIL, fixture sạch phải PASS.
      # Đây là thứ --self-test không bao giờ nói được.
      - if: steps.gate.outputs.run == 'yes'
        name: adversary eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          case "${{ matrix.cli }}" in
            claude) AGENT='claude -p --agent adversary --permission-mode bypassPermissions --strict-mcp-config' ;;
            codex)  AGENT='codex exec --json --dangerously-bypass-approvals-and-sandbox -' ;;
          esac
          node install.mjs --eval --agent "$AGENT" --timeout 1200 --keep | tee eval.log

      # Log của agent là thứ duy nhất trả lời được "nó trượt ở đâu" sau một đêm.
      - if: always() && steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.cli }}
          path: |
            eval.log
            /tmp/sh-eval-*/agent.log
          if-no-files-found: warn
          retention-days: 14
