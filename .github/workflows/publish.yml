# Publish lên npm khi push tag v*.
#
# Không có NPM_TOKEN nào ở đây: dùng Trusted Publishing (OIDC). npm đổi token
# ngắn hạn trực tiếp với GitHub, nên không có secret nào để rò, và 2FA
# `auth-and-writes` không chặn — OTP chỉ hỏi khi publish từ máy cá nhân.
#
# Cần bật một lần trên npmjs.com:
#   npmjs.com/package/spec-harness → Settings → Trusted Publisher → GitHub Actions
#   Repository: thnhtus/spec-harness   Workflow: publish.yml
#
# Phát hành:  npm version patch && git push --follow-tags

name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # bắt buộc cho OIDC; thiếu là npm publish từ chối
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Trusted publishing cần npm >= 11.5.1; Node 24 ship npm 11.x cũ hơn. Ghim major
      # chứ không @latest: npm major sau có thể bỏ Node đang dùng, @latest sẽ tự vỡ bản không chạy
      # được — workflow đang xanh tự đỏ vào một ngày không ai đụng vào repo.
      - run: npm install -g npm@11

      # Tag và package.json lệch nhau thì tag trỏ vào một version khác cái vừa
      # publish — về sau `git checkout v0.1.1` ra đúng cây code của 0.1.2.
      - name: tag phải khớp package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          [ "$tag" = "$pkg" ] || { echo "✖ tag $tag ≠ package.json $pkg"; exit 1; }

      # TRÊN TARBALL, không phải trên cây repo. Chạy trên cây repo là đúng cái đã
      # để lọt 0.1.4: `.claude-plugin/` thiếu trong `files`, cây repo có file nên
      # self-test xanh, tarball không có nên người cài `npx spec-harness` ăn
      # ENOENT. Chỉ bản sắp gửi đi mới đáng kiểm.
      - name: self-test trên tarball sắp publish
        run: |
          npm pack --silent | tail -1 | xargs -I{} tar xzf {} -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/package" && node install.mjs --self-test
      - run: npm publish
