# Eval adversary (#58): chạy `install.mjs --eval` trên runner sạch — không có
# MCP/hook/CLAUDE.md cấp user nào, nên đo đúng harness chứ không đo máy ai.
#
# Bấm tay (Actions → eval → Run workflow), không gắn vào push/publish: mỗi case
# ~10 phút model sonnet, tiền thật. Chạy trước khi cắt release có đổi role/gate.
#
# Cần một lần: repo Settings → Secrets → Actions → ANTHROPIC_API_KEY.
#
# Matrix đọc thẳng từ cases.json nên không lệch được: thêm case là CI chạy case đó.
# ponytail: sandbox là mkdtemp chưa được trust → Claude bỏ qua hook frontmatter
# (--guard-role). Điểm "không sửa ngoài task folder" vẫn được chấm bằng git status
# sau khi chạy; muốn hook chạy thật thì ghi hasTrustDialogAccepted cho path đó.

name: eval

on:
  workflow_dispatch:
    inputs:
      case:
        description: "id một case trong kernel/eval/adversary/cases.json (trống = tất cả)"
        required: false
      model:
        description: "model cho claude -p"
        default: sonnet

jobs:
  cases:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.m.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env: { ONLY: "${{ inputs.case }}" }
        run: |
          ids=$(node -p 'JSON.stringify(require("./kernel/eval/adversary/cases.json").cases.map(c=>c.id).filter(i=>!process.env.ONLY||i===process.env.ONLY))')
          [ "$ids" != "[]" ] || { echo "✖ không có case '$ONLY' trong cases.json"; exit 1; }
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

  eval:
    needs: cases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.cases.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      # Thiếu secret thì đỏ, không skip xanh: một eval "passed" mà không chạy
      # model nào là đúng loại tín hiệu giả mà eval sinh ra để bắt.
      - name: cần ANTHROPIC_API_KEY
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: '[ -n "$ANTHROPIC_API_KEY" ] || { echo "✖ thêm secret ANTHROPIC_API_KEY (Settings → Secrets → Actions)"; exit 1; }'
      - run: npm install -g @anthropic-ai/claude-code@2
      - name: eval ${{ matrix.case }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TMPDIR: ${{ runner.temp }}/eval
        run: |
          mkdir -p "$TMPDIR"
          node install.mjs --eval --case "${{ matrix.case }}" --keep \
            --agent 'claude -p --model ${{ inputs.model || 'sonnet' }} --agent adversary --permission-mode bypassPermissions --strict-mcp-config'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.case }}
          path: |
            ${{ runner.temp }}/eval/*/agent.log
            ${{ runner.temp }}/eval/*/shop/docs/tasks/**/09-Adversarial-Review.md
            ${{ runner.temp }}/eval/*/shop/docs/tasks/**/task.agent.json
          if-no-files-found: warn
